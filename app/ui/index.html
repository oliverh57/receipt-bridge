<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Receipt Bridge</title>
  <link rel="stylesheet" href="/static/app.css">
  <script>window.RB_TOKEN = "__TOKEN__";</script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🧾</span>
        <span>Receipt Bridge</span>
      </div>

      <nav class="nav" aria-label="Views">
        <button class="nav-item" data-view="pending">
          <span class="nav-ic" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.8h5.2l3.3 3.3v9.1H4z"/><path d="M9 1.8v3.4h3.5"/><path d="M6.2 8.5h4M6.2 11h4"/></svg></span><span class="nav-label">Files</span><span class="count" data-count="files"></span>
        </button>
        <div class="nav-sep" role="separator"></div>
        <button class="nav-item" data-view="statement">
          <span class="nav-ic" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6L8 2.6 14 6z"/><path d="M2.5 13.4h11"/><path d="M4.3 7.8v3.8M8 7.8v3.8M11.7 7.8v3.8"/></svg></span><span class="nav-label">Bank Feed</span><span class="count warn" data-count="statement"></span>
        </button>
        <button class="nav-item" data-view="expenses">
          <span class="nav-ic" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1.6" y="4" width="12.8" height="8" rx="1.3"/><circle cx="8" cy="8" r="1.8"/><path d="M4 6.3v.01M12 9.7v.01"/></svg></span><span class="nav-label">Expenses</span>
        </button>
        <div class="nav-sep" role="separator"></div>
        <button class="nav-item" data-view="emails">
          <span class="nav-ic" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="3.4" width="12.4" height="9.2" rx="1.4"/><path d="M2.4 4.3L8 8.6l5.6-4.3"/></svg></span><span class="nav-label">Emails</span>
        </button>
        <button class="nav-item" data-view="archived">
          <span class="nav-ic" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="2.6" width="12.4" height="3.2" rx=".9"/><path d="M2.9 5.8v7.6h10.2V5.8"/><path d="M6.4 8.6h3.2"/></svg></span><span class="nav-label">Archived</span>
        </button>
      </nav>

      <div class="sync">
        <div class="status" id="status" aria-live="polite"></div>
        <button class="btn small" id="scan-btn" title="Check FreeAgent, the receipt inbox and Gmail now. This also runs automatically.">Check now</button>
      </div>

      <div class="sandbox-badge" id="sandbox-badge" hidden>
        <b>Sandbox</b>
        <span>Practice company only.</span>
      </div>
      <div class="sidebar-foot">
        <button class="nav-item" data-view="settings">
          <span class="nav-ic" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.6h2.1M7.9 4.6h5.6M2.5 11.4h7M12.9 11.4h.6"/><circle cx="6.2" cy="4.6" r="1.6"/><circle cx="11.2" cy="11.4" r="1.6"/></svg></span><span class="nav-label">Settings</span><span class="dot" id="settings-dot" hidden></span>
        </button>
      </div>
    </aside>

    <main class="main">
      <div class="progress" id="progress" hidden><div class="progress-bar" id="progress-bar"></div></div>

      <div id="banner"></div>

      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <div id="modal"></div>
  <div id="setup"></div>

  <script src="/static/app.js"></script>
  <script src="/static/match.js"></script>
  <script src="/static/emails.js"></script>
</body>
</html>
