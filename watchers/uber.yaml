# Created in Receipt Bridge from an example email.
# Edit freely — or remove it in Settings. Field reference: watchers/README.md
id: uber
name: Uber
vendor: Uber
enabled: true
created_by: app
gmail_query: from:(uber.com) subject:("trip with Uber")
lookback_days: 365
match:
  from_contains: uber.com
  subject_contains: trip with Uber
fields:
  total:
    type: money
    required: true
    patterns:
    - Total[\s:]*£\s*([0-9][0-9,]*(?:\.[0-9]{1,2})?)
    source: text
  currency:
    value: GBP
  purchased_on:
    type: date
    default: email_date
    patterns: []
  description:
    source: subject
    patterns:
    - (.+)
pdf:
- render_email
filename: '{purchased_on} {vendor} {currency}{total}.pdf'
