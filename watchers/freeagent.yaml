# FreeAgent's own monthly subscription invoice.
#
# The easiest supplier so far, because FreeAgent attach the real thing:
# every receipt email carries FreeAgent-Invoice-<Month>-<Year>.pdf, a proper
# VAT invoice with an invoice number, net/VAT/gross split and their VAT
# registration number. So there is nothing to scrape and nothing to render —
# the `attachment` step lifts the supplier's own document straight out of the
# email, which beats any reconstruction of it.
#
# The invoice number lives only inside that PDF, never in the email body,
# which is what `source: attachment_text` is for.
#
# Note this is a genuine VAT invoice with reclaimable VAT (20%), unlike the
# rail fares from Trainline, which are zero-rated.

id: freeagent
name: FreeAgent
vendor: FreeAgent
enabled: true

gmail_query: 'from:(support@freeagent.com) subject:("your receipt for")'

# Billed monthly, so a year picks up a full set without being expensive —
# these need no browser round-trip.
lookback_days: 365

match:
  from_contains: "freeagent.com"
  subject_contains: "your receipt for"
  body_contains: "subscription"
  exclude_if_contains:
    - "payment has failed"
    - "we were unable to take"
    - "your card was declined"

fields:
  # "Invoice #001756271" — inside the attached PDF only.
  reference:
    source: attachment_text
    required: true
    patterns:
      - 'Invoice\s*#\s*([0-9]{4,})'

  # "payment of £6.00 was successfully taken"
  total:
    type: money
    required: true
    patterns:
      - 'payment of\s*£\s*([0-9][0-9,]*(?:\.[0-9]{1,2})?)'
      - 'Total:\s*£\s*([0-9][0-9,]*(?:\.[0-9]{1,2})?)'

  currency:
    value: GBP

  # Reclaimable VAT, worth carrying through to the review screen.
  net:
    type: money
    patterns:
      - 'Net Amount:\s*£\s*([0-9][0-9,]*(?:\.[0-9]{1,2})?)'

  vat:
    type: money
    patterns:
      - 'VAT:\s*£\s*([0-9][0-9,]*(?:\.[0-9]{1,2})?)'

  # "on 20 Aug 26 from your card" — two-digit year.
  purchased_on:
    type: date
    date_formats:
      - "%d %b %y"
      - "%d %b %Y"
    default: email_date
    patterns:
      - 'successfully taken\s*on\s*(\d{1,2}\s+[A-Za-z]{3,}\s+\d{2,4})'
      - 'Payment date:\s*(\d{1,2}\s+[A-Za-z]{3,}\s+\d{2,4})'

  # "your receipt for August 2026"
  # "your receipt for August 2026" is in the subject line only — searching
  # the body found nothing, and every description read "..., None".
  period:
    source: subject
    patterns:
      - 'your receipt for\s+([A-Za-z]+\s+\d{4})'

  plan:
    patterns:
      - '\d+\s*x\s*(FreeAgent[^\n]*?)\s*\n'

  payment_method:
    patterns:
      - 'Payment method:\s*([^\n]+)'

  description:
    template: "FreeAgent subscription, {period}"

# Take FreeAgent's own invoice. Falling back to a render of the covering
# email would lose the invoice number and the VAT breakdown, so it is only
# there to stop a missing attachment costing the whole receipt.
pdf:
  - step: attachment
    filename_matches: 'FreeAgent-Invoice.*\.pdf'
  - render_email

# 2026-08-20 FreeAgent GBP6.00 001756271.pdf
filename: "{purchased_on} {vendor} {currency}{total} {reference}.pdf"
